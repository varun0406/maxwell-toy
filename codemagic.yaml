workflows:
  ios-unsigned-ipa:
    name: Maxwell Accounting iOS (Unsigned IPA)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Setup Node 22 & Install Dependencies
        script: |
          # Ensure Node 22+ is active
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
            nvm install 22
            nvm use 22
          fi
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          cd frontend
          npm install --legacy-peer-deps
      - name: Build Web App & Compile Unsigned IPA
        script: |
          set -e
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
            nvm use 22
          fi
          chmod +x scripts/build-unsigned-ipa.sh
          ./scripts/build-unsigned-ipa.sh
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - varun@example.com
        notify:
          failure: true
          success: false

  android-apk:
    name: Maxwell Accounting Android (APK)
    max_build_duration: 20
    instance_type: linux_x2
    environment:
      java: 17
      node: 22
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Setup Node 22 & Install Dependencies
        script: |
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
            nvm install 22
            nvm use 22
          fi
          echo "Node version: $(node -v)"
          cd frontend
          npm install --legacy-peer-deps
      - name: Build Web App & Sync Capacitor Android
        script: |
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
            nvm use 22
          fi
          cd frontend
          npm run build
          npx cap sync android
      - name: Build Android Debug APK
        script: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - frontend/android/app/build/outputs/apk/**/*.apk
