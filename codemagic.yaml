workflows:
  ios-signed-adhoc:
    name: Maxwell Accounting iOS (Signed Ad-Hoc IPA)
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Code Manager CI
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.maxwell.accounting
        provisioning_profiles:
          - maxwell_adhoc
        certificates:
          - maxwell-acc
      node: 22
      xcode: latest
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Setup Node 22 & Install Dependencies
        script: |
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
            nvm install 22
            nvm use 22
          fi
          echo "Node version: $(node -v)"
          cd frontend
          npm install --legacy-peer-deps
      - name: Build Web App & Sync Capacitor iOS
        script: |
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
            nvm use 22
          fi
          cd frontend
          npm run build
          npx cap sync ios
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles --project frontend/ios/App/App.xcodeproj
      - name: Build Signed IPA
        script: |
          xcode-project build-ipa \
            --project frontend/ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - kotwaniv03@gmail.com
        notify:
          failure: true
          success: true

  android-apk:
    name: Maxwell Accounting Android (APK)
    max_build_duration: 20
    instance_type: linux_x2
    environment:
      java: 17
      node: 22
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Setup Node 22 & Install Dependencies
        script: |
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
            nvm install 22
            nvm use 22
          fi
          echo "Node version: $(node -v)"
          cd frontend
          npm install --legacy-peer-deps
      - name: Build Web App & Sync Capacitor Android
        script: |
          if [ -s "$HOME/.nvm/nvm.sh" ]; then
            . "$HOME/.nvm/nvm.sh"
            nvm use 22
          fi
          cd frontend
          npm run build
          npx cap sync android
      - name: Build Android Debug APK
        script: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - frontend/android/app/build/outputs/apk/**/*.apk
